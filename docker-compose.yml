# Local development database. Start: `docker compose up -d`
services:
  postgres:
    image: postgres:17-alpine
    container_name: bdshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bdshop
      POSTGRES_PASSWORD: bdshop_dev_password
      POSTGRES_DB: bdshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdshop -d bdshop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
